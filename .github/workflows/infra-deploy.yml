# Deploys the infrastructure (infrastructure/main.bicep) at subscription scope.
#
# Auth: the student's own az CLI token store, stored as repo secret
# AZURE_CLI_TOKENS by scripts/preflight.sh (students cannot create service
# principals in the FH OOe tenant — app registration is disabled there).
# The login step below decodes the secret into $HOME/.azure on the runner.
#
# Required repo secrets/variables (set by scripts/preflight.sh):
#   Secret   AZURE_CLI_TOKENS     base64 tar of the student's ~/.azure token store
#   Secret   UPLOAD_TOKEN         optional — keeps the upload token stable across redeploys
#   Variable AZURE_SUBSCRIPTION_ID, AZURE_TENANT_ID, RESOURCE_GROUP, LOCATION, DEPLOYMENT_NAME
#   Variables ACR_NAME, FUNCTION_APP_NAME, STORAGE_ACCOUNT_NAME, IMAGE_CONTAINER_NAME,
#             CONTAINER_APP_NAME — set automatically by this workflow from the outputs
#
# ACR_NAME is also used to keep an already-pushed app image across infra
# redeploys (when the 'latest' tag exists, the placeholder is not re-applied).

name: infra-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infrastructure/**"]

permissions:
  contents: read
  actions: write   # to publish the deployment outputs as repo variables (gh variable set)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure with the student's az token (repo secret)
        env:
          AZURE_CLI_TOKENS: ${{ secrets.AZURE_CLI_TOKENS }}
        run: |
          mkdir -p "$HOME/.azure"
          echo "$AZURE_CLI_TOKENS" | base64 -d | tar -xz -C "$HOME/.azure"
          az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          az account show --query "{name:name, id:id, user:user.name}" -o json

      - name: Resolve app image (keep already-pushed image across infra redeploys)
        id: image
        run: |
          IMG=""
          if [ -n "${{ vars.ACR_NAME }}" ] \
             && az acr repository show-tags --name "${{ vars.ACR_NAME }}" --repository upload-app -o tsv 2>/dev/null | grep -qx latest; then
            IMG="${{ vars.ACR_NAME }}.azurecr.io/upload-app:latest"
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Deploy Bicep at subscription scope
        run: |
          az account set --subscription "$(az account show --query id -o tsv)"
          PARAMS=(rgName="${{ vars.RESOURCE_GROUP }}" location="${{ vars.LOCATION }}")
          if [ -n "${{ steps.image.outputs.image }}" ]; then
            PARAMS+=(uploadAppImage="${{ steps.image.outputs.image }}")
          fi
          # keep the upload token STABLE across CI infra redeploys (otherwise it
          # rotates to a new GUID every run and saved tokens stop working)
          if [ -n "${{ secrets.UPLOAD_TOKEN }}" ]; then
            PARAMS+=(uploadToken="${{ secrets.UPLOAD_TOKEN }}")
          fi
          az deployment sub create \
            --name "${{ vars.DEPLOYMENT_NAME || 'clc3-2026' }}" \
            --location "${{ vars.LOCATION }}" \
            --template-file infrastructure/main.bicep \
            --parameters "${PARAMS[@]}"
          # If role assignments fail due to AAD propagation delay, simply re-run
          # this workflow with the same parameters.

      - name: Show deployment outputs
        run: |
          az deployment sub show \
            --name "${{ vars.DEPLOYMENT_NAME || 'clc3-2026' }}" \
            --query properties.outputs -o json

      # Publish the infra outputs as repo variables so the function/containerapp
      # workflows know the resource names (they are deterministic but not
      # computable outside ARM: take(uniqueString(subscriptionId, rgName), 16)).
      - name: Set repo variables from deployment outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$(az deployment sub show --name "${{ vars.DEPLOYMENT_NAME || 'clc3-2026' }}" --query properties.outputs -o json)"
          for pair in FUNCTION_APP_NAME:functionAppName STORAGE_ACCOUNT_NAME:storageAccountName \
                      IMAGE_CONTAINER_NAME:imageContainerName ACR_NAME:acrName CONTAINER_APP_NAME:containerAppName; do
            var="${pair%%:*}"; out="${pair#*:}"
            val="$(jq -r --arg o "$out" '.[$o].value' <<<"$OUT")"
            if [ -n "$val" ] && [ "$val" != "null" ]; then
              gh variable set "$var" --body "$val"
              echo "set $var=$val"
            else
              echo "WARNING: output $out missing — variable $var not set" >&2
            fi
          done
