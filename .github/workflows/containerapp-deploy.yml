# Builds the upload app image on the runner, pushes it to the ACR created by
# infra-deploy, and updates the Container App to the new image.
#
# NOTE: `az acr build` (ACR Tasks) is NOT used on purpose — ACR Tasks are
# blocked on Azure for Students / free-credit subscriptions
# (TasksOperationsNotAllowed) and require Standard/Premium SKUs. A runner-side
# `docker build` + `docker push` with an `az acr login --expose-token` token
# (the student's Azure AD identity, AcrPush via Owner) works everywhere.
#
# Auth: the student's az CLI token store as repo secret AZURE_CLI_TOKENS
# (set by scripts/preflight.sh — students cannot create service principals
# in the FH OOe tenant).
#
# Required repo secrets/variables:
#   Secret   AZURE_CLI_TOKENS     (from preflight.sh)
#   Variable AZURE_SUBSCRIPTION_ID, RESOURCE_GROUP, ACR_NAME, CONTAINER_APP_NAME
#            (ACR_NAME / CONTAINER_APP_NAME are set by the infra-deploy workflow)

name: containerapp-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/upload-app/**"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure with the student's az token (repo secret)
        env:
          AZURE_CLI_TOKENS: ${{ secrets.AZURE_CLI_TOKENS }}
        run: |
          mkdir -p "$HOME/.azure"
          echo "$AZURE_CLI_TOKENS" | base64 -d | tar -xz -C "$HOME/.azure"
          az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          az account show --query "{name:name, id:id, user:user.name}" -o json

      - name: Verify infra variables are set (run infra-deploy first)
        run: |
          if [ -z "${{ vars.RESOURCE_GROUP }}" ] || [ -z "${{ vars.ACR_NAME }}" ] || [ -z "${{ vars.CONTAINER_APP_NAME }}" ]; then
            echo "::error::RESOURCE_GROUP/ACR_NAME/CONTAINER_APP_NAME are not set — run the infra-deploy workflow first (it publishes the deployment outputs as repo variables), then re-run this workflow."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ACR with an Azure AD token (no admin user needed)
        run: |
          TOKEN="$(az acr login --name "${{ vars.ACR_NAME }}" --expose-token --query accessToken -o tsv)"
          echo "$TOKEN" | docker login "${{ vars.ACR_NAME }}.azurecr.io" \
            -u 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build and push image, update container app
        run: |
          SERVER="${{ vars.ACR_NAME }}.azurecr.io"
          docker build -t "$SERVER/upload-app:${{ github.sha }}" -t "$SERVER/upload-app:latest" \
            -f src/upload-app/Dockerfile src/upload-app
          docker push "$SERVER/upload-app:${{ github.sha }}"
          docker push "$SERVER/upload-app:latest"
          # --registry-server/--registry-identity: pull auth for the ACR image
          # uses the app's system-assigned identity, which infra-deploy's rbac
          # module granted AcrPull (the app is created WITHOUT a registry entry
          # so its first revision can provision with the public placeholder image
          # before any role assignment exists).
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "$SERVER/upload-app:${{ github.sha }}" \
            --registry-server "$SERVER" \
            --registry-identity system
          echo "Deployed $SERVER/upload-app:${{ github.sha }}"
