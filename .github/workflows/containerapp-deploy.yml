# Builds the upload app image, pushes it to the ACR created by infra-deploy,
# and updates the Container App to the new image.
#
# Required repo variables:
#   RESOURCE_GROUP      e.g. rg-clc3-<lastname>
#   ACR_NAME            e.g. acr<suffix>   (from infra outputs)
#   CONTAINER_APP_NAME  e.g. ca-upload-<suffix>

name: containerapp-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/upload-app/**"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR and update container app
        run: |
          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/upload-app:${{ github.sha }}"
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "upload-app:${{ github.sha }}" \
            --image "upload-app:latest" \
            --file src/upload-app/Dockerfile \
            src/upload-app
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "$IMAGE"
          echo "Deployed $IMAGE"
