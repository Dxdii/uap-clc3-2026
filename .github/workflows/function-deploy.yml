# Builds and deploys the Flex Consumption Python function to the function app
# created by infra-deploy. Flex Consumption has NO remote build, so the package
# is built on the runner (--build local, Python 3.13 — no macOS-wheel issue).
#
# Auth: the student's az CLI token store as repo secret AZURE_CLI_TOKENS
# (set by scripts/preflight.sh — students cannot create service principals
# in the FH OOe tenant).
#
# Required repo secrets/variables:
#   Secret   AZURE_CLI_TOKENS     (from preflight.sh)
#   Variable AZURE_SUBSCRIPTION_ID, RESOURCE_GROUP, DEPLOYMENT_NAME
#   FUNCTION_APP_NAME / STORAGE_ACCOUNT_NAME / IMAGE_CONTAINER_NAME are resolved
#   from the infra-deploy deployment outputs via 'az deployment sub show'
#   (run infra-deploy first).

name: function-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/image-analysis-function/**"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/image-analysis-function
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure with the student's az token (repo secret)
        env:
          AZURE_CLI_TOKENS: ${{ secrets.AZURE_CLI_TOKENS }}
        run: |
          mkdir -p "$HOME/.azure"
          echo "$AZURE_CLI_TOKENS" | base64 -d | tar -xz -C "$HOME/.azure"
          az account set --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          az account show --query "{name:name, id:id, user:user.name}" -o json

      - name: Resolve infra outputs (run infra-deploy first)
        id: infra
        run: |
          if [ -z "${{ vars.RESOURCE_GROUP }}" ]; then
            echo "::error::RESOURCE_GROUP variable is not set — run scripts/preflight.sh first."
            exit 1
          fi
          DEP_NAME="${{ vars.DEPLOYMENT_NAME || 'clc3-2026' }}"
          OUT="$(az deployment sub show --name "$DEP_NAME" --query properties.outputs -o json 2>/dev/null)" || OUT=""
          if [ -z "$OUT" ] || [ "$OUT" = "null" ]; then
            echo "::error::deployment '$DEP_NAME' not found — run the infra-deploy workflow first, then re-run this workflow."
            exit 1
          fi
          APP="$(jq -r .functionAppName.value <<<"$OUT")"
          ST="$(jq -r .storageAccountName.value <<<"$OUT")"
          IMG="$(jq -r .imageContainerName.value <<<"$OUT")"
          if [ -z "$APP" ] || [ "$APP" = "null" ] || [ -z "$ST" ] || [ "$ST" = "null" ] || [ -z "$IMG" ] || [ "$IMG" = "null" ]; then
            echo "::error::deployment outputs missing functionAppName/storageAccountName/imageContainerName — re-run the infra-deploy workflow."
            exit 1
          fi
          echo "FUNCTION_APP_NAME=$APP" >> "$GITHUB_OUTPUT"
          echo "STORAGE_ACCOUNT_NAME=$ST" >> "$GITHUB_OUTPUT"
          echo "IMAGE_CONTAINER_NAME=$IMG" >> "$GITHUB_OUTPUT"
          echo "resolved FUNCTION_APP_NAME=$APP STORAGE_ACCOUNT_NAME=$ST IMAGE_CONTAINER_NAME=$IMG"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm

      - name: Install Python dependencies (local build)
        run: pip install -r requirements.txt

      - name: Publish function app (local build — Flex has no remote build)
        run: func azure functionapp publish "${{ steps.infra.outputs.FUNCTION_APP_NAME }}" --build local

      # The Event-Grid-sourced BLOB trigger receives events at the blob
      # extension webhook (NOT an azurefunction endpoint — that is only for
      # EventGrid-trigger functions). The webhook is authenticated with the
      # 'blobs_extension' host system key, and the endpoint is validated
      # against the function, so the subscription can only be created AFTER
      # the code is published. Idempotent: updates the endpoint if it exists.
      - name: Create/update Event Grid subscription -> blob webhook
        run: |
          SUB_ID="$(az account show --query id -o tsv)"
          RG="${{ vars.RESOURCE_GROUP }}"
          APP="${{ steps.infra.outputs.FUNCTION_APP_NAME }}"
          STORAGE_ID="/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.Storage/storageAccounts/${{ steps.infra.outputs.STORAGE_ACCOUNT_NAME }}"
          SUB_NAME="sub-$APP-AnalyzeImage"
          HOST="$(az functionapp show --name "$APP" --resource-group "$RG" --query properties.defaultHostName -o tsv)"
          # the blobs_extension system key can take a moment to appear after publish -> retry
          BLOBS_KEY=""
          for i in $(seq 1 10); do
            # '|| true' so a 4xx/5xx from listkeys under 'bash -e' doesn't abort the step
            BLOBS_KEY="$(az rest --method POST \
              --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/$APP/host/default/listkeys?api-version=2024-11-01" \
              --query systemKeys.blobs_extension -o tsv 2>/dev/null || true)"
            # '-o tsv' prints the literal 'None' for a null query result — treat as missing
            if [ -n "$BLOBS_KEY" ] && [ "$BLOBS_KEY" != "None" ]; then break; fi
            BLOBS_KEY=""
            echo "blobs_extension key not available yet (attempt $i), waiting 15s ..."
            sleep 15
          done
          if [ -z "$BLOBS_KEY" ]; then
            echo "ERROR: could not read blobs_extension system key — check the function app is running"
            exit 1
          fi
          ENDPOINT="https://$HOST/runtime/webhooks/blobs?functionName=Host.Functions.AnalyzeImage&code=$BLOBS_KEY"
          if az eventgrid event-subscription show --source-resource-id "$STORAGE_ID" --name "$SUB_NAME" >/dev/null 2>&1; then
            # webhook endpoint of an existing subscription: try update, else delete+recreate
            if ! az eventgrid event-subscription update --source-resource-id "$STORAGE_ID" --name "$SUB_NAME" \
                 --endpoint-type webhook --endpoint "$ENDPOINT" 2>/dev/null; then
              az eventgrid event-subscription delete --source-resource-id "$STORAGE_ID" --name "$SUB_NAME"
              az eventgrid event-subscription create --source-resource-id "$STORAGE_ID" --name "$SUB_NAME" \
                --endpoint-type webhook --endpoint "$ENDPOINT" \
                --included-event-types Microsoft.Storage.BlobCreated \
                --subject-begins-with "/blobServices/default/containers/${{ steps.infra.outputs.IMAGE_CONTAINER_NAME }}/blobs/"
            fi
          else
            az eventgrid event-subscription create --source-resource-id "$STORAGE_ID" --name "$SUB_NAME" \
              --endpoint-type webhook --endpoint "$ENDPOINT" \
              --included-event-types Microsoft.Storage.BlobCreated \
              --subject-begins-with "/blobServices/default/containers/${{ steps.infra.outputs.IMAGE_CONTAINER_NAME }}/blobs/"
          fi
